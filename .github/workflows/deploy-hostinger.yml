name: Deploy to Hostinger

on:
  workflow_dispatch:

# The frontend and the API ship together: the React build calls /api on the same
# origin, so a frontend ahead of its API is a broken site. Deploy is manual
# (workflow_dispatch) and takes the ref you choose, so shipping does not require
# merging to main.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          # Same-origin in production: empty base means the app calls /api on
          # www.infiniteyatra.com. Set the repository variable only for a
          # split-origin setup; it is normalised so it cannot produce /api/api.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npx vite build
          if grep -rq "/api/api/" dist/assets/*.js; then
            echo "::error::The build produced a doubled /api/api path."
            exit 1
          fi
          for leaked in DB_PASSWORD SESSION_SECRET IY_ADMIN_PASSWORD; do
            if grep -rq "$leaked" dist/ 2>/dev/null; then
              echo "::error::$leaked appears in the client bundle."
              exit 1
            fi
          done
          echo "Frontend build clean: single /api prefix, no server secrets."

      - name: Install API dependencies
        working-directory: api
        run: npm ci --omit=dev

      - name: API smoke check
        working-directory: api
        run: node -e "import('./src/app.js').then(()=>console.log('API module graph loads'))"
        env:
          NODE_ENV: development

      - name: Publish frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Publish API
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./api/
          # OUTSIDE public_html: the API must never be served as static files,
          # and its .env must never be fetchable over HTTP.
          server-dir: ./iy-api/
          exclude: |
            **/.git*
            **/.git*/**
            **/test/**
            **/.env

      # Remaining steps are owner actions on Hostinger and are deliberately not
      # automated here:
      #   1. Point the Node.js app at iy-api/, entry src/server.js, Node 22
      #   2. Set the environment from api/.env.example (no values are committed)
      #   3. npm run migrate        (once per schema change)
      #   4. npm run seed:admin     (once, ever)
      #   5. Route /api/* to the Node app in the domain's proxy configuration
