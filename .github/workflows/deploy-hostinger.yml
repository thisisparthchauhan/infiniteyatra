name: Deploy to Hostinger FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      
      - name: ⚙️ Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: 📦 Install dependencies
        run: npm ci
        
      - name: 🔐 Create env file
        run: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_BOOKING_API_BASE_URL=${{ vars.VITE_BOOKING_API_BASE_URL }}
          EOF

      # CUTOVER - the frontend is served from Hostinger, which has no rewrite to
      # Cloud Functions. An empty base would silently resolve to same-origin
      # /api/... on infiniteyatra.com and every booking call would 404 in a way
      # that looks like an auth failure. Fail the build instead of shipping that.
      - name: 🔎 Verify booking API base is configured
        run: |
          BASE="${{ vars.VITE_BOOKING_API_BASE_URL }}"
          if [ -z "$BASE" ]; then
            echo "::error::VITE_BOOKING_API_BASE_URL is not set. Set the repository variable to the deployed Functions origin before deploying the PB frontend."
            exit 1
          fi
          case "$BASE" in
            https://*) ;;
            *) echo "::error::VITE_BOOKING_API_BASE_URL must be an https origin."; exit 1 ;;
          esac
          case "$BASE" in
            *localhost*|*127.0.0.1*|*://*:*[0-9]/*|*-emulator*)
              echo "::error::VITE_BOOKING_API_BASE_URL looks like a development or emulator URL."; exit 1 ;;
          esac
          echo "Booking API base configured (origin only, no secret): $BASE"

      - name: 🔨 Build Project
        run: npx vite build
        
      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
