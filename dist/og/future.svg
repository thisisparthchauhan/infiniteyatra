<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="60%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairline" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#000"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Decorative stars -->
  <g fill="#fff">
    <circle cx="80" cy="120" r="1.5" opacity="0.7"/>
    <circle cx="220" cy="80" r="1" opacity="0.5"/>
    <circle cx="380" cy="180" r="2" opacity="0.8"/>
    <circle cx="550" cy="60" r="1" opacity="0.4"/>
    <circle cx="720" cy="140" r="1.5" opacity="0.6"/>
    <circle cx="900" cy="200" r="1" opacity="0.5"/>
    <circle cx="1050" cy="100" r="2" opacity="0.7"/>
    <circle cx="1120" cy="280" r="1" opacity="0.4"/>
    <circle cx="160" cy="350" r="1.5" opacity="0.5"/>
    <circle cx="60" cy="500" r="1" opacity="0.4"/>
    <circle cx="950" cy="480" r="1.5" opacity="0.6"/>
    <circle cx="1130" cy="560" r="1" opacity="0.4"/>
    <circle cx="780" cy="540" r="1" opacity="0.4"/>
  </g>

  <!-- Top reticle -->
  <text x="60" y="60" fill="#fff" fill-opacity="0.5" font-family="Helvetica Neue, Inter, sans-serif" font-size="14" letter-spacing="4">00 — SPACE PROGRAM</text>

  <!-- Hairline -->
  <line x1="60" y1="90" x2="280" y2="90" stroke="url(#hairline)" stroke-width="1"/>

  <!-- Hero title -->
  <text x="60" y="320" fill="#fff" font-family="Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="140" letter-spacing="-4">INFINITE</text>
  <text x="60" y="450" fill="#fff" font-family="Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="140" letter-spacing="-4">YATRA</text>

  <!-- Tagline -->
  <text x="60" y="525" fill="#fff" fill-opacity="0.7" font-family="Helvetica Neue, Inter, sans-serif" font-size="22" font-weight="300">Today across Earth. Tomorrow beyond it.</text>

  <!-- Bottom strip -->
  <line x1="60" y1="568" x2="1140" y2="568" stroke="#fff" stroke-opacity="0.15" stroke-width="1"/>
  <text x="60" y="595" fill="#fff" fill-opacity="0.4" font-family="ui-monospace, monospace" font-size="13" letter-spacing="3">IY SPACE PROGRAM · MISSION BRIEF · CLASSIFIED · INITIATED 2026</text>

  <!-- Right side meta block -->
  <g transform="translate(820, 240)">
    <line x1="0" y1="0" x2="280" y2="0" stroke="#fff" stroke-opacity="0.2"/>
    <text x="0" y="28" fill="#fff" fill-opacity="0.5" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">PROGRAM</text>
    <text x="280" y="28" text-anchor="end" fill="#fff" font-family="Helvetica Neue" font-weight="700" font-size="16" letter-spacing="2">SPACE</text>
    <line x1="0" y1="50" x2="280" y2="50" stroke="#fff" stroke-opacity="0.2"/>
    <text x="0" y="78" fill="#fff" fill-opacity="0.5" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">FLEET</text>
    <text x="280" y="78" text-anchor="end" fill="#fff" font-family="Helvetica Neue" font-weight="700" font-size="16" letter-spacing="2">4 VEHICLES</text>
    <line x1="0" y1="100" x2="280" y2="100" stroke="#fff" stroke-opacity="0.2"/>
    <text x="0" y="128" fill="#fff" fill-opacity="0.5" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">STATUS</text>
    <circle cx="200" cy="123" r="3" fill="#fff"/>
    <text x="280" y="128" text-anchor="end" fill="#fff" font-family="Helvetica Neue" font-weight="700" font-size="16" letter-spacing="2">DEVELOPMENT</text>
    <line x1="0" y1="150" x2="280" y2="150" stroke="#fff" stroke-opacity="0.2"/>
  </g>
</svg>
