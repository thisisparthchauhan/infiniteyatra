# Nginx site config for Infinite Yatra on a single VPS.
# Serves the built React SPA and reverse-proxies /api to the Node API (PM2).
#
# Install:
#   sudo cp deploy/nginx-infiniteyatra.conf /etc/nginx/sites-available/infiniteyatra
#   sudo ln -s /etc/nginx/sites-available/infiniteyatra /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS:
#   sudo certbot --nginx -d infiniteyatra.com -d www.infiniteyatra.com
# (certbot rewrites this file to add the TLS listener + redirect.)

server {
    listen 80;
    listen [::]:80;
    server_name infiniteyatra.com www.infiniteyatra.com;

    # Absolute path to the built frontend (contents of dist/).
    root /var/www/infiniteyatra;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → Node app on localhost:8080 (PM2). Same-origin, so no CORS needed.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — every other route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
